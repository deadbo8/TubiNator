services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tubinator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tubinator}
      POSTGRES_DB: ${POSTGRES_DB:-tubinator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tubinator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tubinator]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tubinator}:${POSTGRES_PASSWORD:-tubinator}@db:5432/${POSTGRES_DB:-tubinator}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to localhost only; reach the app directly at 127.0.0.1:3002 if needed.
      - "127.0.0.1:3002:3000"
    networks:
      tubinator:
      # Joined to your existing Caddy's network so it can proxy to us by name.
      proxy:
        aliases:
          - tubinator-web

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://web:3000
    depends_on: [web]
    networks: [tubinator]

  # Optional bundled reverse proxy. NOT started by default.
  # Only use this if you do NOT already have a proxy on this host.
  # Start it with:  docker compose --profile standalone-proxy up -d
  # If you route Tubinator through your existing main Caddy (recommended for
  # DuckDNS), leave this disabled and proxy to 127.0.0.1:3002 instead.
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone-proxy"]
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "8080:80"
      - "9443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks: [tubinator]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  tubinator:
  # Your existing reverse-proxy network. Confirm the real name with:
  #   docker inspect caddy | python3 -c "import sys,json;print(list(json.load(sys.stdin)[0]['NetworkSettings']['Networks'].keys()))"
  # It is almost certainly hoodik_default (the hoodik compose project network).
  proxy:
    external: true
    name: hoodik_default
