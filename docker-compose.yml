services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tubinator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tubinator}
      POSTGRES_DB: ${POSTGRES_DB:-tubinator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tubinator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tubinator]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tubinator}:${POSTGRES_PASSWORD:-tubinator}@db:5432/${POSTGRES_DB:-tubinator}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Map to localhost so it is only reachable by the reverse proxy
      - "127.0.0.1:3001:3000"
    networks: [tubinator]

volumes:
  pgdata:

networks:
  tubinator:
